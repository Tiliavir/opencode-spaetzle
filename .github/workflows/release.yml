name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "claude"

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine build variant
        id: variant
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/claude" ]]; then
            echo "is_claude=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_claude=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (multi-platform builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            ${{ steps.variant.outputs.is_claude == 'true' && 'type=raw,value=claude' || '' }}
            ${{ steps.variant.outputs.is_claude != 'true' && 'type=semver,pattern={{version}}' || '' }}
            ${{ steps.variant.outputs.is_claude != 'true' && 'type=semver,pattern={{major}}.{{minor}}' || '' }}
            ${{ steps.variant.outputs.is_claude != 'true' && 'type=semver,pattern={{major}}' || '' }}
            ${{ steps.variant.outputs.is_claude != 'true' && 'type=raw,value=latest' || '' }}
          labels: |
            org.opencontainers.image.title=devcon-spaetzle
            org.opencontainers.image.description=${{ steps.variant.outputs.is_claude == 'true' && 'Docker dev environment for Claude Code' || 'Docker dev environment for the OpenCode AI coding agent' }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.variant.outputs.is_claude != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
